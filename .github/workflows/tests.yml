name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so upstream dependency breaks (this suite floats its deps) surface
  # on their own, not on the next unrelated push. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# A newer push to the same branch/PR cancels the in-progress run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the versions advertised in pyproject.toml classifiers.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/PhilipQuirke/quanta_mech_interp.git
          pip install pytest
          pip install .

      - name: Run test suite
        run: pytest tests
