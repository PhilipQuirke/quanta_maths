name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/PhilipQuirke/quanta_mech_interp.git
          pip install .

      # tests_sae.py is excluded: it fails to import against the current
      # QuantaMechInterp release (analyze_mlp_with_sae / optimize_sae_hyperparameters
      # no longer exist there), and its own test bodies are already disabled (if False).
      - name: Run test suite
        working-directory: Tests
        run: python -m unittest tests_maths
