[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta_maths"
version = "1.0.0"
description = "Maths Mechanistic Interpretability tools"
authors = [
    {name = "Philip Quirke et al", email = "philip@withmartian.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.18.1",
    "pandas",
    "torch",
    "transformer_lens",
    "scikit-learn",
    "scikit-optimize",
    "matplotlib",
    "requests",
    "tqdm",
    "QuantaMechInterp>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quanta_maths*", "maths_catgen*"]
namespaces = true

[tool.pytest.ini_options]
# torchtyping (an unmaintained transitive dep) registers a pytest plugin that
# fails to import against torch >= 2.13 ("Cannot subclass _TensorBase directly"),
# which crashes pytest at startup. Nothing in this project imports torchtyping at
# runtime, so we just stop pytest from auto-loading its plugin.
addopts = "-p no:torchtyping"
